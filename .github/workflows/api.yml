name: api

on:
  push:
    branches: [master]
    paths: ['services/api/**', 'contracts/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['services/api/**', 'contracts/**', '.github/workflows/api.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers needs Docker, which ubuntu-latest provides.
      # -Dcontract.check=true fails the build when contracts/openapi.json is stale.
      - run: mvn -B verify -Dcontract.check=true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: services/api/target/surefire-reports
